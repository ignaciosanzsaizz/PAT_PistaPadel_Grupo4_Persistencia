<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guards.js"></script>
    <script src="js/mis-reservas.js" defer></script>
</head>
<body class="app-page">
<header class="app-header">
    <div class="app-header-inner">
        <h1>Mis Reservas</h1>
        <nav class="app-nav">
            <a href="pistas.html">Ver pistas</a>
            <a href="profile.html">Mi perfil</a>
            <button id="logout-btn" class="logout-btn" type="button">Cerrar sesión</button>
        </nav>
    </div>
</header>

<main class="app-main">
    <p id="mensaje-pagina" class="status-message">Cargando tus reservas...</p>

    <section id="lista-reservas-container" class="content-card" hidden>
        <ul id="lista-reservas" style="list-style: none; padding: 0;"></ul>
    </section>

    <section id="modificar-reserva-form" class="content-card" hidden style="margin-top: 20px; border: 2px solid #007bff;">
        <h3>Modificar Reserva <span id="mod-id-reserva"></span></h3>
        <div class="form-group-inline">
            <label>Nueva Fecha:</label>
            <input type="date" id="mod-fecha">
        </div>
        <div class="form-group-inline">
            <label>Nueva Hora de Inicio:</label>
            <input type="time" id="mod-hora">
        </div>
        <div class="form-group-inline">
            <label>Duración (min):</label>
            <input type="number" id="mod-duracion" step="30" min="30">
        </div>
        <div style="margin-top: 10px;">
            <button id="btn-guardar-cambios" style="background-color: #28a745; color: white;">Guardar</button>
            <button id="btn-cancelar-cambios" style="background-color: #6c757d; color: white;">Cancelar</button>
        </div>
    </section>
</main>
</body>
</html>
