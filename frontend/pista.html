<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de pista</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guards.js"></script>
    <script src="js/detallesPista.js" defer></script>
</head>
<body class="app-page">
<header class="app-header">
    <div class="app-header-inner">
        <h1>Detalle de pista</h1>
        <nav class="app-nav">
            <a href="pistas.html">Volver al listado</a>
            <a href="profile.html">Mi perfil</a>
            <button id="logout-btn" class="logout-btn" type="button">Cerrar sesión</button>
        </nav>
    </div>
</header>

<main class="app-main">
    <p id="mensaje-pagina" class="status-message">Cargando información...</p>

    <section id="detalle-pista" class="content-card" hidden>
        <h2 id="nombre-pista"></h2>
        <div class="detail-grid">
            <p id="ubicacion-pista"></p>
            <p id="precio-pista"></p>
            <p id="estado-pista"></p>
            <p id="fecha-alta-pista"></p>
        </div>
    </section>

    <section id="seccion-disponibilidad" class="content-card" hidden>
        <h3>Consultar disponibilidad</h3>

        <div class="availability-controls">
            <div class="form-group-inline">
                <label for="fecha-disponibilidad">Fecha</label>
                <input type="date" id="fecha-disponibilidad">
            </div>

            <button id="btn-consultar-disponibilidad" type="button">
                Consultar disponibilidad
            </button>
        </div>

        <p id="mensaje-disponibilidad" class="availability-message"></p>
        <ul id="lista-disponibilidad"></ul>
    </section>
</main>
</body>
</html>
