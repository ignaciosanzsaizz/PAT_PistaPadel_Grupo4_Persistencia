<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Reserva Pista Pádel</title>
    <link rel="stylesheet" href="css/style.css"> <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guards.js"></script>
    <script>requireNoAuth(); // No dejar entrar si ya está logueado</script>
</head>
<body>
    <div class="auth-container">
        <h2>Crear una Cuenta</h2>
        <div id="error-message" style="color: red; display: none; margin-bottom: 15px;"></div>
        <div id="success-message" style="color: green; display: none; margin-bottom: 15px;"></div>
        
        <form id="register-form">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
            </div>
            <div>
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" style="margin-top: 15px;">Registrarse</button>
        </form>
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const apellidos = document.getElementById('apellidos').value;
            const email = document.getElementById('email').value;
            const telefono = document.getElementById('telefono').value;
            const password = document.getElementById('password').value;
            
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            try {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
                submitBtn.disabled = true; // Prevenir doble clic

                await AuthService.register(nombre, apellidos, email, password, telefono);
                
                successDiv.textContent = '¡Registro exitoso! Redirigiendo al login...';
                successDiv.style.display = 'block';
                
                // Redirigir al login después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
